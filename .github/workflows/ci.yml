name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruefen:
    name: Typecheck, Tests und Build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: multi-mine-host-build
          path: out/
          retention-days: 7

  build:
    name: Windows-Installer
    runs-on: windows-latest
    needs: pruefen
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Installer erstellen
        run: npm run dist

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: multi-mine-host-installer
          path: release/*.exe
          retention-days: 14
